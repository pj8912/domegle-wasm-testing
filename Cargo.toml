[package]
name = "domegle-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Domegle node compiled to WebAssembly: iroh discovery and signalling in the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
async-channel = "2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
# default-features = false drops the metrics feature, which does not build for
# wasm. Browsers cannot send UDP, so every connection is relayed.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-subscriber-wasm = "0.1"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.5"

[profile.release]
codegen-units = 1
strip = "symbols"
debug = false
lto = true
opt-level = "z"
panic = "abort"
